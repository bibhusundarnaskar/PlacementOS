services:
  postgres:
    image: postgres:16-alpine
    container_name: placementos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: placementos
      POSTGRES_PASSWORD: placementos
      POSTGRES_DB: placementos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placementos -d placementos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
